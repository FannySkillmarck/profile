    <script>
      /* Compatibility guard for browser extensions that overwrite window.fetch */
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || originalFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          /* Fallback if defineProperty fails */
        }

        /* Suppress external chrome-extension error bubbles */
        window.addEventListener('error', function(event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.stack &&
            (event.reason.stack.indexOf('chrome-extension://') !== -1 ||
             event.reason.stack.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
